# Build engine, push runtime closures to anoptic-games cachix.
# Explicit `cachix push` of built outputs only. Action auto-push would eat the 5 GB free tier.
# Build github: ref, NOT checkout. Runner `.#x` paths differ from user `github:...` paths.
name: cachix

on:
  push:
    # module-audio: release-build coverage while audio is hot.
    # Pin step is main-gated; branch runs never repoint production pins.
    branches: [main, module-audio]
  workflow_dispatch:

# One run per ref. Cancel in-flight on newer push (avoids pin races).
concurrency:
  group: cachix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  push-to-cachix:
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64-linux: play launcher (engine + GPU bridges) and the Windows cross exe.
          - os: ubuntu-latest
            targets: .#play .#release-wsl
          # aarch64-darwin: play launcher (engine, MoltenVK baked in).
          - os: macos-latest
            targets: .#play
    runs-on: ${{ matrix.os }}
    steps:
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      # skipPush: still wires cache as substituter (pull unchanged paths).
      - uses: cachix/cachix-action@v16
        with:
          name: anoptic-games
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      # Pin each target under a stable name (e.g. play-x86_64-linux). --keep-revisions 1.
      # PIN ONLY ON MAIN. Branch runs build/push/verify; never repoint production pins.
      - name: Build, push, and pin runtime closures
        run: |
          set -euo pipefail
          # retry CMD...: 3 attempts, 30s apart (substituter / github: tarball / cachix 5xx).
          # Messages to stderr; keeps command substitution clean.
          retry() {
            for i in 1 2 3; do
              if "$@"; then return 0; fi
              echo "attempt $i/3 failed: $*" >&2
              if [ "$i" -lt 3 ]; then sleep 30; fi
            done
            return 1
          }
          system=$(nix eval --raw --impure --expr builtins.currentSystem)
          : > outpaths.txt
          for t in ${{ matrix.targets }}; do
            p=$(retry nix build "github:${{ github.repository }}/${{ github.sha }}${t#.}" --print-out-paths --no-link)
            echo "$p" >> outpaths.txt
            retry cachix push anoptic-games "$p"
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              retry cachix pin anoptic-games "${t#.#}-$system" "$p" --keep-revisions 1
            fi
          done
      # Green push ≠ served: prove each top-level narinfo answers from the CDN.
      - name: Verify cache serves the paths
        run: |
          set -euo pipefail
          while read -r p; do
            h=$(basename "$p" | cut -c1-32)
            curl -sf -o /dev/null "https://anoptic-games.cachix.org/$h.narinfo" || { echo "cache MISSING $p" >&2; exit 1; }
          done < outpaths.txt

  # Manual-dispatch-only: checkout vs github: eval divergence probe (2026-07-15).
  # Prints source narHashes and drvPaths side by side.
  # Delete once the mechanism is identified.
  eval-divergence-probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Compare checkout eval vs github ref eval
        run: |
          set -euo pipefail
          git rev-parse HEAD; git status --porcelain | head
          echo "checkout metadata:"; nix flake metadata . --json | head -c 2000; echo
          echo "github metadata:"; nix flake metadata "github:${{ github.repository }}/${{ github.sha }}" --json | head -c 2000; echo
          echo "checkout drv: $(nix eval --raw .#play.drvPath)"
          echo "github   drv: $(nix eval --raw "github:${{ github.repository }}/${{ github.sha }}#play.drvPath")"

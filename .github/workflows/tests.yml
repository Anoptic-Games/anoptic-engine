# Sandbox suites on every PR and push, main included.
# Secretless: flake nixConfig substitution (public cache, read-only); nothing pushed.
# Main-push release builds: cachix.yml.
name: tests

on:
  pull_request:
  push:

# Force-pushes supersede in-flight runs instead of queueing behind them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pure eval across all systems. Catches flake breakage before compile.
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - run: nix flake check --no-build --all-systems

  # Building a suite runs it: ctest lives in the derivation's checkPhase.
  suites:
    needs: flake-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suite: tests-headless
          - os: ubuntu-latest
            suite: tests-asan
          - os: ubuntu-latest
            suite: tests-tsan
          # Renderer suite under Xvfb; Vulkan device tests skip by design (no GPU).
          - os: ubuntu-latest
            suite: tests-full
          - os: macos-latest
            suite: tests-headless
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - run: nix build .#${{ matrix.suite }} --no-link -L
